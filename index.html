<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BIA Spaces Admin</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--red:#e8120c;--ink:#0a0a0a;--soft:#f6f3f2;--mute:#5d5958}*{box-sizing:border-box;margin:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--soft);color:var(--ink);-webkit-tap-highlight-color:transparent}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;background:#fff;padding:1rem 4%;position:sticky;top:0;z-index:5;border-bottom:1px solid #eee}header b{font-size:1.2rem}header b::before{content:"BIA";background:var(--red);color:#fff;padding:.25rem .55rem;border-radius:8px;margin-right:.6rem;font-style:italic}
main{width:min(900px,92%);margin:1.5rem auto;display:grid;gap:1rem}
.btn{padding:.7rem 1.3rem;border-radius:999px;border:2px solid var(--red);background:var(--red);color:#fff;font:inherit;font-weight:600;cursor:pointer}.btn.o{background:#fff;color:var(--ink);border-color:var(--ink)}.btn.s{padding:.4rem .9rem;font-size:.85rem}.btn.d{background:#fff;color:var(--red)}
.card{background:#fff;border-radius:20px;padding:1.5rem}.lg{width:min(420px,92%);margin:4rem auto;display:grid;gap:.8rem}
input,select{font:inherit;padding:.8rem 1rem;border:1.5px solid #ddd;border-radius:12px;width:100%;background:#fff}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:1rem;align-items:center;background:#fff;border-radius:20px;padding:.9rem}
.row img,.row .nt{width:96px;height:72px;border-radius:12px;object-fit:cover;background:var(--ink)}.row small{color:var(--mute);display:block}.row h3{font-size:1.05rem}
.act{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}@media(max-width:620px){.row{grid-template-columns:80px 1fr}.act{grid-column:1/-1;justify-content:flex-start}.row img,.row .nt{width:80px}}
.sw{display:flex;gap:.4rem;align-items:center;font-size:.85rem;font-weight:600}.sw input{width:20px;height:20px;accent-color:var(--red)}
.er{color:var(--red);font-size:.9rem}.empty{text-align:center;color:var(--mute);padding:3rem}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:1rem;z-index:20}.fm{width:min(620px,100%);display:grid;gap:.8rem;margin:1rem 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}@media(max-width:520px){.g2{grid-template-columns:1fr}}
.md{display:flex;flex-wrap:wrap;gap:.6rem}.mi{position:relative;width:88px;height:68px;border-radius:10px;overflow:hidden;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.8rem}.mi img{width:100%;height:100%;object-fit:cover}.mi button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
(()=>{
const CFG={url:"https://opuqtqlakngsdsqbpjmw.supabase.co",key:"sb_publishable_oioyMU9s6Kn1pdPsRsW84A_rX_8kXPb"}; /* same Supabase URL and anon key as index.html */
const $=id=>document.getElementById(id),app=$("app"),B="space-media";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!CFG.url){app.innerHTML='<div class="card lg"><h2>Connect Supabase first</h2><p>Paste your Supabase project URL and anon key into CFG at the top of this script and in index.html. Then run supabase-setup.sql in the Supabase SQL editor.</p></div>';return}
const sb=supabase.createClient(CFG.url,CFG.key);let list=[],media=[],cur=null;
const shrink=async f=>{if(!f.type.startsWith("image"))return f;try{const b=await createImageBitmap(f),k=Math.min(1,1600/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);const bl=await new Promise(r=>c.toBlob(r,"image/webp",.8));return bl?new File([bl],f.name.replace(/\.\w+$/,"")+".webp",{type:"image/webp"}):f}catch(e){return f}};
const boot=()=>dash();
const dash=async()=>{const{data,error}=await sb.from("spaces").select("*").order("created_at",{ascending:false});list=data||[];draw(error)};
const row=s=>{const c=(s.media||[]).find(m=>m.t=="i");return`<div class="row" data-id="${s.id}">${c?`<img src="${esc(c.u)}" alt="">`:'<div class="nt"></div>'}<div><h3>${esc(s.name)}</h3><small>${esc(s.area)} &bull; ${esc(s.type)} &bull; ${esc(s.room)}</small><b>&#8358;${(+s.price).toLocaleString()}</b></div><div class="act"><label class="sw"><input type="checkbox" class="so" ${s.sold_out?"checked":""}>Sold out</label><button class="btn s o ed">Edit</button><button class="btn s d dl">Delete</button></div></div>`};
const draw=err=>{app.innerHTML=`<header><b>Spaces admin</b><div><button class="btn" id="add">Add space</button></div></header><main>${err?`<p class="er">${esc(err.message)}</p>`:""}${list.length?list.map(row).join(""):'<p class="empty">No spaces yet. Click Add space to publish your first one.</p>'}</main>`;
$("add").onclick=()=>form(null);
document.querySelector("main").onclick=async e=>{const r=e.target.closest(".row");if(!r)return;const s=list.find(x=>x.id==r.dataset.id);
if(e.target.closest(".ed"))form(s);
if(e.target.closest(".dl")&&confirm("Delete this space and its photos and videos?")){const f=(s.media||[]).map(m=>m.u.split("/"+B+"/")[1]).filter(Boolean);if(f.length)await sb.storage.from(B).remove(f);await sb.from("spaces").delete().eq("id",s.id);dash()}};
document.querySelector("main").onchange=async e=>{if(!e.target.classList.contains("so"))return;const r=e.target.closest(".row");await sb.from("spaces").update({sold_out:e.target.checked}).eq("id",r.dataset.id)}};
const form=s=>{cur=s;media=s?[...(s.media||[])]:[];const o=document.createElement("div");o.className="ov";o.innerHTML=`<form class="card fm"><h2>${s?"Edit space":"Add space"}</h2><input id="n" placeholder="Space name" value="${esc(s?.name)}" required><div class="g2"><input id="a" placeholder="Area, e.g. Akoka, Yaba" value="${esc(s?.area)}" required><select id="t"><option>Hostel</option><option>Apartment</option></select></div><div class="g2"><input id="r" placeholder="Room type, e.g. 2-man room" value="${esc(s?.room)}"><input id="p" type="number" min="0" placeholder="Price per session (naira)" value="${s?.price??""}" required></div><div class="g2"><input id="bd" type="number" min="0" placeholder="Beds" value="${s?.beds??""}"><input id="ba" type="number" min="0" placeholder="Baths" value="${s?.baths??""}"></div><div class="g2"><input id="gu" type="number" min="0" placeholder="Guests it sleeps" value="${s?.guests??""}"><input id="af" type="date" title="Available from" value="${s?.available_from??""}"></div><input id="am" placeholder="Amenities, separated by commas e.g. Wi-Fi, Water, Power backup" value="${esc((s?.amenities||[]).join(", "))}"><label class="sw"><input type="checkbox" id="so" ${s?.sold_out?"checked":""}>Mark as sold out</label><div><b>Photos and videos</b><p style="color:var(--mute);font-size:.85rem">The first photo is the cover. Add as many photos and videos as you need.</p></div><div class="md" id="md"></div><input id="fl" type="file" accept="image/*,video/*" multiple><p class="er" id="st"></p><div class="g2"><button class="btn" id="sv">Save</button><button type="button" class="btn o" id="cx">Cancel</button></div></form>`;document.body.append(o);
if(s)$("t").value=s.type;const dm=()=>{$("md").innerHTML=media.map((m,i)=>`<div class="mi">${m.t=="v"?"Video":`<img src="${esc(m.u)}" alt="">`}<button type="button" data-i="${i}" aria-label="Remove">&times;</button></div>`).join("")};dm();
$("md").onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){media.splice(+i,1);dm()}};
$("cx").onclick=()=>o.remove();
$("fl").onchange=async e=>{for(const f0 of e.target.files){$("st").textContent="Optimising and uploading "+f0.name+"...";const f=await shrink(f0);const path=crypto.randomUUID()+"-"+f.name.replace(/[^\w.-]/g,"_"),{error}=await sb.storage.from(B).upload(path,f,{contentType:f.type,cacheControl:"31536000"});if(error){$("st").textContent=error.message;return}media.push({t:f.type.startsWith("video")?"v":"i",u:sb.storage.from(B).getPublicUrl(path).data.publicUrl});dm()}$("st").textContent="";e.target.value=""};
o.querySelector("form").onsubmit=async e=>{e.preventDefault();if(!media.length){$("st").textContent="Add at least one photo.";return}$("sv").disabled=true;const d={name:$("n").value,area:$("a").value,type:$("t").value,room:$("r").value,price:+$("p").value,sold_out:$("so").checked,beds:$("bd").value===""?null:+$("bd").value,baths:$("ba").value===""?null:+$("ba").value,guests:$("gu").value===""?null:+$("gu").value,available_from:$("af").value||null,amenities:$("am").value.split(",").map(x=>x.trim()).filter(Boolean),media};const{error}=cur?await sb.from("spaces").update(d).eq("id",cur.id):await sb.from("spaces").insert(d);if(error){$("st").textContent=error.message;$("sv").disabled=false;return}o.remove();dash()}};
boot()})();
</script></body></html>
